name: Build Android app

# Runs on every push to main, and from the "Run workflow" button in the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # lets the first run commit the Expo project ID to app.json

concurrency:
  group: eas-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check for the Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - run: npx tsc --noEmit

      - name: Create the Expo project (first run only)
        run: |
          if ! grep -q '"projectId"' app.json; then
            eas init --non-interactive --force
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.json
            git commit -m "Link Expo project"
            git push
          fi

      - name: Start the Android build on Expo
        run: |
          eas build --platform android --profile preview --non-interactive --no-wait | tee build.log
          {
            echo "## Android build started"
            echo "The build runs on Expo's servers and takes about 10-15 minutes."
            echo "Open the link below on your phone to follow it and install the APK when it finishes."
            grep -o 'https://expo.dev/[^ ]*builds/[^ ]*' build.log | head -1
          } >> "$GITHUB_STEP_SUMMARY"
