<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bite pin: the bite</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&amp;family=Figtree:wght@600;800&amp;display=swap">
<style>
body{margin:0}
a{color:#ffcc33}a:hover{color:#ffe08a}
</style>
</helmet>
<div style="width: 900px; height: 700px; box-sizing: border-box; padding: 48px; display: flex; flex-direction: column; gap: 28px; background: #0d0e19; color: #f5f2ff; font-family: 'Figtree', ui-sans-serif, system-ui, sans-serif;">
  <svg width="0" height="0" style="position: absolute;" aria-hidden="true">
    <defs>
      <linearGradient id="r-grad" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#ffcc33"></stop><stop offset="0.55" stop-color="#ff7a45"></stop><stop offset="1" stop-color="#ff2d6f"></stop></linearGradient>
      <mask id="r-v1"><rect width="100" height="130" fill="#fff"></rect><circle cx="93" cy="17" r="15" fill="#000"></circle><circle cx="100" cy="37" r="13" fill="#000"></circle><circle cx="78" cy="3" r="12" fill="#000"></circle></mask>
      <mask id="r-v2"><rect width="100" height="130" fill="#fff"></rect><circle cx="79" cy="4" r="12" fill="#000"></circle><circle cx="94" cy="15" r="12" fill="#000"></circle><circle cx="101" cy="32" r="12" fill="#000"></circle></mask>
      <mask id="r-v3"><rect width="100" height="130" fill="#fff"></rect><circle cx="86" cy="7" r="16" fill="#000"></circle><circle cx="102" cy="30" r="16" fill="#000"></circle></mask>
    </defs>
  </svg>
  <div style="display: flex; justify-content: space-between; align-items: baseline;">
    <h1 style="margin: 0; font-family: 'Unbounded', ui-sans-serif, system-ui, sans-serif; font-size: 26px; letter-spacing: -0.02em;">The bite</h1>
    <span style="font-size: 13px; font-weight: 600; color: #9d9abb;">Color on top, pure silhouette below</span>
  </div>
  <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px;">
    <div style="display: flex; flex-direction: column; gap: 14px; align-items: center; padding: 22px 12px; border-radius: 24px; background: #14162d;">
      <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.12em; color: #9d9abb;">CURRENT</span>
      <svg role="img" aria-label="Current bite pin" width="132" height="172" viewBox="0 0 100 130"><path d="M50 4C24 4 4 24 4 50c0 34 46 76 46 76s46-42 46-76C96 24 76 4 50 4z" fill="url(#r-grad)" mask="url(#r-v1)"></path><circle cx="46" cy="56" r="12" fill="#14162d"></circle></svg>
      <svg role="img" aria-label="Current bite pin silhouette" width="90" height="117" viewBox="0 0 100 130"><path d="M50 4C24 4 4 24 4 50c0 34 46 76 46 76s46-42 46-76C96 24 76 4 50 4z" fill="#f5f2ff" mask="url(#r-v1)"></path><circle cx="46" cy="56" r="12" fill="#14162d"></circle></svg>
      <span style="font-size: 14px; font-weight: 600; color: #c9c6e4; text-align: center;">One big smooth curve</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 14px; align-items: center; padding: 22px 12px; border-radius: 24px; background: #14162d; box-shadow: 0 0 0 2px #ffcc33, 0 0 30px -10px #ffcc33;">
      <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.12em; color: #ffcc33;">REFINED · MAIN LOGO</span>
      <svg role="img" aria-label="Refined bite pin with three teeth marks" width="132" height="172" viewBox="0 0 100 130"><path d="M50 4C24 4 4 24 4 50c0 34 46 76 46 76s46-42 46-76C96 24 76 4 50 4z" fill="url(#r-grad)" mask="url(#r-v2)"></path><ellipse cx="32" cy="34" rx="10" ry="6" fill="#fff" opacity="0.45" transform="rotate(-35 32 34)"></ellipse><circle cx="46" cy="56" r="12" fill="#14162d"></circle></svg>
      <svg role="img" aria-label="Refined bite pin silhouette" width="90" height="117" viewBox="0 0 100 130"><path d="M50 4C24 4 4 24 4 50c0 34 46 76 46 76s46-42 46-76C96 24 76 4 50 4z" fill="#f5f2ff" mask="url(#r-v2)"></path><circle cx="46" cy="56" r="12" fill="#14162d"></circle></svg>
      <span style="font-size: 14px; font-weight: 600; color: #c9c6e4; text-align: center;">Three teeth: clearly a bite</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 14px; align-items: center; padding: 22px 12px; border-radius: 24px; background: #14162d;">
      <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.12em; color: #9d9abb;">REFINED · SMALL SIZES</span>
      <svg role="img" aria-label="Simplified bite pin with two big teeth marks" width="132" height="172" viewBox="0 0 100 130"><path d="M50 4C24 4 4 24 4 50c0 34 46 76 46 76s46-42 46-76C96 24 76 4 50 4z" fill="url(#r-grad)" mask="url(#r-v3)"></path><circle cx="44" cy="58" r="14" fill="#14162d"></circle></svg>
      <svg role="img" aria-label="Simplified bite pin silhouette" width="90" height="117" viewBox="0 0 100 130"><path d="M50 4C24 4 4 24 4 50c0 34 46 76 46 76s46-42 46-76C96 24 76 4 50 4z" fill="#f5f2ff" mask="url(#r-v3)"></path><circle cx="44" cy="58" r="14" fill="#14162d"></circle></svg>
      <span style="font-size: 14px; font-weight: 600; color: #c9c6e4; text-align: center;">Two big teeth, bigger hole</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":700}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
