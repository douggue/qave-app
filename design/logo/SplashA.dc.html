<style>
body{margin:0}
a{color:#ffcc33}a:hover{color:#ffe08a}
@keyframes aDrop{0%{transform:translateY(-520px)}22%{transform:translateY(22px)}30%{transform:translateY(8px)}36%{transform:translateY(24px)}100%{transform:translateY(22px)}}
@keyframes aSquash{0%,20%{transform:scale(1,1)}24%{transform:scale(1.18,.82)}32%{transform:scale(.95,1.05)}38%,100%{transform:scale(1,1)}}
@keyframes aLetters{0%,24%{opacity:0;transform:translateY(16px)}38%,100%{opacity:1;transform:translateY(0)}}
@keyframes aDot{0%,30%{opacity:.3;transform:scale(.6)}40%{opacity:1;transform:scale(1.35)}50%,100%{opacity:1;transform:scale(1)}}
@keyframes aRing{0%,32%{opacity:0;transform:scale(.4)}40%{opacity:.9}70%,100%{opacity:0;transform:scale(2.6)}}
@keyframes aTag{0%,45%{opacity:0;transform:translateY(10px)}60%,100%{opacity:1;transform:translateY(0)}}
.a-pin{animation:aDrop 4.2s cubic-bezier(.3,.7,.4,1) infinite}
.a-squash{transform-origin:50% 100%;animation:aSquash 4.2s ease-out infinite}
.a-letters{animation:aLetters 4.2s ease-out infinite}
.a-dot{transform-origin:50px 50px;transform-box:view-box;animation:aDot 4.2s ease-out infinite}
.a-ring{animation:aRing 4.2s ease-out infinite}
.a-tag{animation:aTag 4.2s ease-out infinite}
@media (prefers-reduced-motion:reduce){.a-pin,.a-squash,.a-letters,.a-dot,.a-ring,.a-tag{animation:none}.a-pin{transform:translateY(22px)}}

            <filter id="sa-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"></feGaussianBlur></filter>
          </defs>
          <path d="M50 4C24 4 4 24 4 50c0 34 46 76 46 76s46-42 46-76C96 24 76 4 50 4z" fill="url(#sa-pin)"></path>
          <circle cx="50" cy="50" r="22" fill="#0b0c18"></circle>
          <g class="a-dot"><circle cx="50" cy="50" r="12" fill="#ffcc33" filter="url(#sa-glow)"></circle><circle cx="50" cy="50" r="9" fill="#ffe08a"></circle></g>
        </svg>
